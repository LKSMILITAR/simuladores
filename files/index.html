<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKS MILITAR - Tactical Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-main: #0a0d14;
            --bg-sidebar: rgba(16, 22, 35, 0.7);
            --bg-card: #111622;
            --border-glow: #384f30;
            --accent-green: #5c804f;
            --accent-glow: #7ca86d;
            --text-primary: #f1f5f9;
            --text-muted: #475569;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- MENU LATERAL RETRÁTIL --- */
        #sidebar {
            width: 70px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        #sidebar:hover {
            width: 260px;
            box-shadow: 15px 0 35px rgba(0, 0, 0, 0.5);
            border-right: 1px solid var(--border-glow);
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding-left: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sidebar-brand i {
            font-size: 20px;
            color: var(--accent-green);
            min-width: 35px;
        }

        .sidebar-brand span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        #sidebar:hover .sidebar-brand span { opacity: 1; }

        .menu-section { padding: 20px 0; overflow-y: auto; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            border-left: 3px solid transparent;
            text-transform: capitalize;
        }

        .menu-item i { font-size: 18px; min-width: 35px; }

        .menu-item span {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-weight: 500;
            font-size: 13px;
        }

        #sidebar:hover .menu-item span { opacity: 1; }

        .menu-item:hover, .menu-item.active {
            color: #fff;
            background: rgba(92, 128, 79, 0.15);
            border-left-color: var(--accent-green);
        }

        .menu-item.active i { color: var(--accent-glow); }

        /* --- PAINEL PRINCIPAL --- */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: radial-gradient(circle at top right, #101626 0%, var(--bg-main) 60%);
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--text-muted);
        }

        .content-body { padding: 35px; max-width: 1400px; }

        .category-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .category-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(92, 128, 79, 0.3) 0%, transparent 100%);
        }

        /* --- GRID DE SLOTS COM MINIATURA DE CAPA --- */
        .grid-acervo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .slot-container {
            position: relative;
            background: var(--bg-card);
            border-radius: 8px;
            aspect-ratio: 1 / 1.45;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .slot-container.populated {
            border: 1px solid rgba(92, 128, 79, 0.2);
            background: linear-gradient(145deg, #151c2c 0%, #0d121f 100%);
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .slot-container.populated:hover {
            transform: translateY(-6px);
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px rgba(92, 128, 79, 0.25);
        }

        /* ÁREA EXCLUSIVA DE RENDERIZAÇÃO DA CAPA DO PDF */
        .slot-cover-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d121f;
        }

        .slot-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .slot-container.populated:hover .slot-cover-img {
            opacity: 0.95;
            transform: scale(1.03);
        }

        .slot-overlay-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            background: linear-gradient(180deg, rgba(10, 13, 20, 0.6) 0%, rgba(10, 13, 20, 0.2) 40%, rgba(10, 13, 20, 0.95) 100%);
        }

        .slot-meta {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slot-index {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slot-status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 8px #22c55e;
        }

        .slot-footer {
            position: relative;
            z-index: 3;
        }

        .slot-title {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.3;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* --- VISUALIZADOR DE PDF --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 12, 0.98);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }

        .modal-header-bar {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background: rgba(16, 22, 35, 0.9);
            border-bottom: 1px solid var(--border-glow);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--accent-glow);
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80vw;
        }

        .btn-modal-close {
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-modal-close:hover { color: #f43f5e; }

        #pdf-iframe-container {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-shield-halved"></i>
            <span>LKS MILITAR</span>
        </div>
        <div class="menu-section" id="container-menu"></div>
    </div>

    <div id="main-view">
        <header>
            <h2>ARCHIVE INTERFACE v2.0</h2>
        </header>

        <div class="content-body">
            <div class="category-header" id="txt-categoria-atual">CARREGANDO ACERVO...</div>
            <div class="grid-acervo" id="painel-slots"></div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-header-bar">
            <div class="modal-title" id="pdf-doc-title">DOCUMENTO TÁTICO</div>
            <span class="btn-modal-close" onclick="fecharLivro()">&times;</span>
        </div>
        <iframe id="pdf-iframe-container" src="about:blank"></iframe>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const GITHUB_USER = "lksmilitar";
        const GITHUB_REPO = "simuladores";
        const SUBPASTA   = "files";

        const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SUBPASTA}`;

        async function inicializarAcervo() {
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();
                
                const pastas = dados.filter(item => item.type === 'dir');
                const containerMenu = $('#container-menu');
                containerMenu.empty();

                if (!Array.isArray(pastas) || pastas.length === 0) {
                    $('#txt-categoria-atual').text("NENHUMA CATEGORIA DENTRO DE /FILES");
                    $('#painel-slots').html('<div style="color: #475569;">Crie pastas dentro do diretório files/ para exibir os botões.</div>');
                    return;
                }

                let primeiraPasta = null;

                pastas.forEach((pasta, index) => {
                    const nomeFormatado = pasta.name.replace(/_/g, ' ');
                    if (index === 0) primeiraPasta = pasta.name;

                    const htmlMenuItem = `
                        <div class="menu-item ${index === 0 ? 'active' : ''}" onclick="carregarPasta('${pasta.name}', this)">
                            <i class="fa-solid fa-folder"></i>
                            <span>${nomeFormatado}</span>
                        </div>`;
                    containerMenu.append(htmlMenuItem);
                });

                if (primeiraPasta) {
                    carregarPasta(primeiraPasta, $('.menu-item').first());
                }

            } catch (erro) {
                console.error("Erro ao ler API do GitHub:", erro);
                $('#txt-categoria-atual').text("ERRO AO LER A PASTA FILES");
            }
        }

        async function carregarPasta(nomePasta, elemento) {
            $('.menu-item').removeClass('active');
            if (elemento) $(elemento).addClass('active');

            const tituloFormatado = nomePasta.replace(/_/g, ' ');
            $('#txt-categoria-atual').text(tituloFormatado);

            const painel = $('#painel-slots');
            painel.html('<div style="color: #475569;">ESCANENADO ARQUIVOS...</div>');

            try {
                const resposta = await fetch(`${API_URL}/${nomePasta}`);
                const arquivos = await resposta.json();

                const pdfs = arquivos.filter(arq => arq.name.toLowerCase().endsWith('.pdf'));
                painel.empty();

                if (pdfs.length === 0) {
                    painel.html('<div style="color: #475569;">NENHUM ARQUIVO .PDF NESTA CATEGORIA.</div>');
                    return;
                }

                pdfs.forEach((pdf, index) => {
                    const nomeDocumento = pdf.name.replace('.pdf', '');
                    const slotId = `cover-canvas-${index}`;
                    
                    const htmlSlot = `
                        <div class="slot-container populated" onclick="abrirDocumentoDireto('${pdf.download_url}', '${nomeDocumento}')">
                            <div class="slot-cover-wrapper" id="wrapper-${slotId}">
                                <i class="fa-solid fa-file-pdf" style="font-size: 32px; color: rgba(255,255,255,0.1);"></i>
                            </div>
                            <div class="slot-overlay-gradient"></div>
                            
                            <div class="slot-meta">
                                <div class="slot-index">${String(index + 1).padStart(2, '0')}</div>
                                <div class="slot-status-dot"></div>
                            </div>
                            
                            <div class="slot-footer">
                                <div class="slot-title">${nomeDocumento}</div>
                            </div>
                        </div>`;
                    painel.append(htmlSlot);

                    // EXTRAÇÃO ASSÍNCRONA DA PÁGINA 1 DE CADA PDF
                    gerarMiniaturaCapa(pdf.download_url, `wrapper-${slotId}`);
                });

            } catch (erro) {
                console.error("Erro ao carregar arquivos da pasta:", erro);
                painel.html('<div style="color: #f43f5e;">FALHA AO LER ARQUIVOS DA CATEGORIA.</div>');
            }
        }

        // RENDERIZADOR DA PÁGINA 1
        async function gerarMiniaturaCapa(urlPdf, targetWrapperId) {
            try {
                const carregandoPdf = pdfjsLib.getDocument(urlPdf);
                const pdf = await carregandoPdf.promise;
                const pagina = await pdf.getPage(1);

                const viewport = pagina.getViewport({ scale: 0.4 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await pagina.render({ canvasContext: context, viewport: viewport }).promise;
                
                const imgUrl = canvas.toDataURL('image/jpeg', 0.8);
                const wrapper = document.getElementById(targetWrapperId);
                if (wrapper) {
                    wrapper.innerHTML = `<img src="${imgUrl}" class="slot-cover-img" alt="Capa">`;
                }
            } catch (e) {
                console.warn("Não foi possível extrair a capa do PDF:", urlPdf);
            }
        }

        function abrirDocumentoDireto(urlPdf, titulo) {
            $('#pdf-doc-title').text(titulo.toUpperCase());
            $('#pdf-iframe-container').attr('src', urlPdf);
            $('#modal-overlay').css('display', 'flex');
        }

        function fecharLivro() {
            $('#modal-overlay').hide();
            $('#pdf-iframe-container').attr('src', 'about:blank');
        }

        $(document).ready(inicializarAcervo);
    </script>
</body>
</html>
