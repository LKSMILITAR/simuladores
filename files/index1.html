<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKS MILITAR - Tactical Library v3.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-main: #06080c;
            --bg-sidebar: rgba(10, 14, 22, 0.92);
            --bg-card: #0d121d;
            --border-dim: rgba(92, 128, 79, 0.25);
            --border-glow: #5c804f;
            --accent-green: #22c55e;
            --accent-glow: #4ade80;
            --accent-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-muted: #64748b;
            --glass-blur: blur(16px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(92, 128, 79, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* MENU LATERAL TÁTICO */
        #sidebar {
            width: 72px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-dim);
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        #sidebar:hover {
            width: 290px;
            box-shadow: 20px 0 40px rgba(0, 0, 0, 0.8);
            border-right-color: var(--border-glow);
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid var(--border-dim);
            background: rgba(0, 0, 0, 0.3);
        }

        .sidebar-brand i { font-size: 22px; color: var(--accent-glow); min-width: 38px; }

        .sidebar-brand-text {
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .sidebar-brand-text .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #fff;
        }

        .sidebar-brand-text .sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--accent-glow);
            letter-spacing: 1px;
        }

        #sidebar:hover .sidebar-brand-text { opacity: 1; }

        .menu-section { padding: 15px 0; overflow-y: auto; flex: 1; }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            border-left: 3px solid transparent;
            font-size: 13px;
        }

        .menu-item-info { display: flex; align-items: center; }
        .menu-item i { font-size: 16px; min-width: 38px; color: #64748b; transition: color 0.2s ease; }

        .menu-item span.title {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-weight: 500;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .menu-item .badge-count {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            background: rgba(92, 128, 79, 0.2);
            color: var(--accent-glow);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-dim);
        }

        #sidebar:hover .menu-item span.title,
        #sidebar:hover .menu-item .badge-count { opacity: 1; }

        .menu-item:hover, .menu-item.active {
            color: #fff;
            background: rgba(92, 128, 79, 0.12);
            border-left-color: var(--accent-glow);
        }

        .menu-item:hover i, .menu-item.active i { color: var(--accent-glow); }

        /* ÁREA PRINCIPAL */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid var(--border-dim);
            background: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(8px);
            gap: 20px;
        }

        .header-title-zone {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sys-status-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sys-status-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .search-input {
            width: 100%;
            padding: 8px 14px 8px 38px;
            background: rgba(13, 18, 29, 0.9);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(92, 128, 79, 0.3);
            background: #0d121d;
        }

        .view-toggle-btns {
            display: flex;
            background: rgba(13, 18, 29, 0.9);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            padding: 2px;
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .view-btn.active {
            background: var(--border-glow);
            color: #fff;
        }

        .content-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .category-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-header-title::after {
            content: '';
            width: 80px;
            height: 2px;
            background: var(--border-glow);
            display: inline-block;
            margin-left: 10px;
        }

        /* GRID E LISTA DE SLOTS TÁTICOS */
        .grid-acervo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }

        .grid-acervo.list-mode {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* CARD NO MODO GRID */
        .slot-container {
            position: relative;
            background: var(--bg-card);
            border-radius: 6px;
            aspect-ratio: 1 / 1.42;
            border: 1px solid var(--border-dim);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        /* CORNERS TÁTICOS HUD */
        .slot-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 8px; height: 8px;
            border-top: 2px solid var(--accent-glow);
            border-left: 2px solid var(--accent-glow);
            z-index: 4;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .slot-container::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 8px; height: 8px;
            border-bottom: 2px solid var(--accent-glow);
            border-right: 2px solid var(--accent-glow);
            z-index: 4;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .slot-container.populated {
            cursor: pointer;
            background: linear-gradient(160deg, #111827 0%, #080c14 100%);
        }

        .slot-container.populated:hover {
            transform: translateY(-4px);
            border-color: var(--accent-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(92, 128, 79, 0.2);
        }

        .slot-container.populated:hover::before,
        .slot-container.populated:hover::after { opacity: 1; }

        .slot-cover-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #080c14;
        }

        .slot-cover-img {
            width: 100%; height: 100%;
            object-fit: cover; opacity: 0.45;
            transition: opacity 0.3s ease, transform 0.3s ease;
            filter: grayscale(20%);
        }

        .slot-container.populated:hover .slot-cover-img {
            opacity: 0.75; transform: scale(1.04); filter: grayscale(0%);
        }

        .slot-overlay-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            background: linear-gradient(180deg, rgba(6, 8, 12, 0.5) 0%, rgba(6, 8, 12, 0.1) 40%, rgba(6, 8, 12, 0.95) 100%);
        }

        .slot-meta {
            position: relative; z-index: 3;
            display: flex; justify-content: space-between; align-items: center;
        }

        .slot-index {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; font-weight: 800; color: var(--accent-glow);
            background: rgba(6, 8, 12, 0.85); padding: 2px 6px;
            border-radius: 3px; border: 1px solid var(--border-dim);
        }

        .slot-status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green);
        }

        .slot-footer { position: relative; z-index: 3; }

        .slot-title {
            font-family: 'Inter', sans-serif;
            font-size: 11px; font-weight: 600; color: #ffffff;
            letter-spacing: 0.3px; line-height: 1.35;
            word-break: break-word; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* ESTILIZAÇÃO DO MODO LISTA COMPACTA */
        .grid-acervo.list-mode .slot-container {
            aspect-ratio: auto;
            height: 50px;
            flex-direction: row;
            align-items: center;
            padding: 0 20px;
            background: #0d121d;
        }

        .grid-acervo.list-mode .slot-cover-wrapper,
        .grid-acervo.list-mode .slot-overlay-gradient { display: none; }

        .grid-acervo.list-mode .slot-meta { width: auto; gap: 15px; }
        .grid-acervo.list-mode .slot-footer { flex: 1; margin-left: 20px; }

        /* MODAL E LEITOR TÁTICO */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 10, 0.95);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #modal-overlay.active { display: flex; opacity: 1; }

        .modal-container {
            width: 96%; max-width: 1100px; height: 94vh;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(92, 128, 79, 0.15);
            display: flex; flex-direction: column;
            overflow: hidden;
            transform: scale(0.97);
            transition: transform 0.2s ease;
        }

        #modal-overlay.active .modal-container { transform: scale(1); }

        .modal-header {
            height: 55px;
            background: rgba(10, 14, 22, 0.95);
            padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-dim);
        }

        .modal-title-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 60vw;
        }

        .modal-title-zone i { color: var(--accent-glow); font-size: 14px; }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px; letter-spacing: 1.5px;
            color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-tool-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-dim);
            color: #94a3b8;
            width: 32px; height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .modal-tool-btn:hover {
            color: #fff;
            background: var(--border-glow);
            border-color: var(--accent-glow);
        }

        .modal-close-btn {
            background: none; border: none; color: #64748b;
            font-size: 22px; cursor: pointer; transition: color 0.2s ease;
            margin-left: 10px;
        }

        .modal-close-btn:hover { color: #ef4444; }

        .modal-body {
            flex: 1; background: #04060a;
            display: flex; justify-content: center; align-items: center;
            position: relative; overflow: auto; padding: 20px;
        }

        #pdf-canvas {
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border-radius: 2px; background: #fff; display: block;
            transition: opacity 0.15s ease;
        }

        .nav-side-btn {
            position: absolute; top: 0; height: 100%; width: 60px;
            background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, transparent 100%);
            border: none; color: rgba(255, 255, 255, 0.3);
            font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; z-index: 10;
        }

        .nav-side-btn.prev { left: 0; }
        .nav-side-btn.next {
            right: 0;
            background: linear-gradient(-90deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .nav-side-btn:hover {
            color: var(--accent-glow);
            background: rgba(92, 128, 79, 0.15);
            font-size: 28px;
        }

        .modal-footer {
            height: 45px; background: #080c14;
            border-top: 1px solid var(--border-dim);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #94a3b8;
        }

        .page-jumper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-input {
            width: 45px;
            background: #0d121d;
            border: 1px solid var(--border-dim);
            color: var(--accent-glow);
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            border-radius: 3px;
            padding: 2px 0;
            outline: none;
        }

        #pdf-loader {
            position: absolute; color: var(--accent-glow);
            font-family: 'Orbitron', sans-serif; font-size: 12px;
            letter-spacing: 2px; display: none;
            flex-direction: column; align-items: center; gap: 12px; z-index: 20;
        }

        #pdf-loader i { font-size: 26px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-shield-halved"></i>
            <div class="sidebar-brand-text">
                <span class="title">LKS MILITAR</span>
                <span class="sub">TAC_LIBRARY v3.0</span>
            </div>
        </div>
        <div class="menu-section" id="container-menu"></div>
    </div>

    <div id="main-view">
        <header>
            <div class="header-title-zone">
                <div class="sys-status-tag">
                    <div class="dot"></div>
                    <span>SYS_ONLINE</span>
                </div>
            </div>

            <div class="header-controls">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" class="search-input" placeholder="BUSCAR MANUAL TÁTICO...">
                </div>

                <div class="view-toggle-btns">
                    <button class="view-btn active" id="btn-view-grid" title="Visão em Grade"><i class="fa-solid fa-border-all"></i></button>
                    <button class="view-btn" id="btn-view-list" title="Visão em Lista"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>
        </header>

        <div class="content-body">
            <div class="category-header">
                <div class="category-header-title" id="txt-categoria-atual">INICIALIZANDO...</div>
            </div>
            <div class="grid-acervo" id="painel-slots"></div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title-zone">
                    <i class="fa-solid fa-file-pdf"></i>
                    <div class="modal-title" id="pdf-modal-title">DECODIFICANDO...</div>
                </div>

                <div class="modal-actions">
                    <button class="modal-tool-btn" id="btn-zoom-out" title="Reduzir Zoom"><i class="fa-solid fa-minus"></i></button>
                    <button class="modal-tool-btn" id="btn-zoom-in" title="Aumentar Zoom"><i class="fa-solid fa-plus"></i></button>
                    <button class="modal-tool-btn" id="btn-zoom-reset" title="Ajustar à Tela"><i class="fa-solid fa-expand"></i></button>
                    <button class="modal-close-btn" id="close-modal">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <button class="nav-side-btn prev" id="prev-page-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="pdf-loader">
                    <i class="fa-solid fa-spinner"></i>
                    <span>PROCESSANDO PÁGINA...</span>
                </div>
                <canvas id="pdf-canvas"></canvas>
                <button class="nav-side-btn next" id="next-page-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="modal-footer">
                <div class="page-jumper">
                    <span>PÁGINA</span>
                    <input type="number" id="input-page-num" class="page-input" value="1" min="1">
                    <span>DE <span id="total-pages-count">0</span></span>
                </div>
                <div id="doc-status-info">LEITOR VETORIAL ATIVO</div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const GITHUB_USER = "lksmilitar";
        const GITHUB_REPO = "simuladores";
        const SUBPASTA   = "files";

        const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SUBPASTA}`;

        let pdfDoc = null,
            pageNum = 1,
            pdfScaleModifier = 1.0,
            pageIsRendering = false,
            pageNumPending = null,
            currentRenderTask = null,
            listaDocumentosAtuais = [],
            documentoAtualKey = '';

        const canvas = document.getElementById('pdf-canvas'),
              ctx = canvas.getContext('2d');

        async function inicializarAcervo() {
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();
                
                const pastas = dados.filter(item => item.type === 'dir');
                const containerMenu = $('#container-menu');
                containerMenu.empty();

                if (!Array.isArray(pastas) || pastas.length === 0) {
                    $('#txt-categoria-atual').text("NENHUMA PASTA EM /FILES");
                    $('#painel-slots').html('<div style="color: #475569;">Crie pastas no diretório files/ do repositório.</div>');
                    return;
                }

                let primeiraPasta = null;

                for (let index = 0; index < pastas.length; index++) {
                    const pasta = pastas[index];
                    const nomeFormatado = pasta.name.replace(/_/g, ' ');
                    if (index === 0) primeiraPasta = pasta.name;

                    const idBadge = `badge-${pasta.name}`;
                    const htmlMenuItem = `
                        <div class="menu-item ${index === 0 ? 'active' : ''}" onclick="carregarPasta('${pasta.name}', this)">
                            <div class="menu-item-info">
                                <i class="fa-solid fa-folder-closed"></i>
                                <span class="title">${nomeFormatado}</span>
                            </div>
                            <span class="badge-count" id="${idBadge}">...</span>
                        </div>`;
                    containerMenu.append(htmlMenuItem);

                    atualizarContadorDocs(pasta.name, idBadge);
                }

                if (primeiraPasta) {
                    carregarPasta(primeiraPasta, $('.menu-item').first());
                }

            } catch (erro) {
                console.error("Erro na API do GitHub:", erro);
                $('#txt-categoria-atual').text("ERRO AO CARREGAR REPOSITÓRIO");
            }
        }

        async function atualizarContadorDocs(nomePasta, badgeId) {
            try {
                const resp = await fetch(`${API_URL}/${nomePasta}`);
                const arqs = await resp.json();
                const pdfs = arqs.filter(arq => arq.name.toLowerCase().endsWith('.pdf'));
                $(`#${badgeId}`).text(pdfs.length);
            } catch (e) {
                $(`#${badgeId}`).text('0');
            }
        }

        async function carregarPasta(nomePasta, elemento) {
            $('.menu-item').removeClass('active');
            if (elemento) $(elemento).addClass('active');

            const tituloFormatado = nomePasta.replace(/_/g, ' ');
            $('#txt-categoria-atual').text(tituloFormatado);
            $('#search-input').val('');

            const painel = $('#painel-slots');
            painel.html('<div style="color: #475569; font-family: \'JetBrains Mono\'; font-size: 12px;">VARRENDO DIRETÓRIO...</div>');

            try {
                const resposta = await fetch(`${API_URL}/${nomePasta}`);
                const arquivos = await resposta.json();

                listaDocumentosAtuais = arquivos.filter(arq => arq.name.toLowerCase().endsWith('.pdf'));
                renderizarSlots(listaDocumentosAtuais);

            } catch (erro) {
                console.error("Erro ao carregar arquivos:", erro);
                painel.html('<div style="color: #f43f5e; font-family: \'JetBrains Mono\'; font-size: 12px;">FALHA NO MAPEAMENTO DA CATEGORIA.</div>');
            }
        }

        function renderizarSlots(documentos) {
            const painel = $('#painel-slots');
            painel.empty();

            if (documentos.length === 0) {
                painel.html('<div style="color: #475569; font-family: \'JetBrains Mono\'; font-size: 12px;">NENHUM DOCUMENTO LOCALIZADO.</div>');
                return;
            }

            documentos.forEach((pdf, index) => {
                const nomeDocumento = pdf.name.replace('.pdf', '');
                const slotId = `cover-canvas-${index}`;
                
                const htmlSlot = `
                    <div class="slot-container populated" onclick="abrirModalPdf('${pdf.download_url}', '${nomeDocumento}')">
                        <div class="slot-cover-wrapper" id="wrapper-${slotId}">
                            <i class="fa-solid fa-file-pdf" style="font-size: 28px; color: rgba(255,255,255,0.08);"></i>
                        </div>
                        <div class="slot-overlay-gradient"></div>
                        
                        <div class="slot-meta">
                            <div class="slot-index">DOC_${String(index + 1).padStart(2, '0')}</div>
                            <div class="slot-status-dot"></div>
                        </div>
                        
                        <div class="slot-footer">
                            <div class="slot-title">${nomeDocumento}</div>
                        </div>
                    </div>`;
                painel.append(htmlSlot);

                gerarMiniaturaCapa(pdf.download_url, `wrapper-${slotId}`);
            });
        }

        async function gerarMiniaturaCapa(urlPdf, targetWrapperId) {
            try {
                const carregandoPdf = pdfjsLib.getDocument(urlPdf);
                const pdf = await carregandoPdf.promise;
                const pagina = await pdf.getPage(1);

                const viewport = pagina.getViewport({ scale: 0.35 });
                const canvasTemp = document.createElement('canvas');
                const contextTemp = canvasTemp.getContext('2d');
                canvasTemp.height = viewport.height;
                canvasTemp.width = viewport.width;

                await pagina.render({ canvasContext: contextTemp, viewport: viewport }).promise;
                
                const imgUrl = canvasTemp.toDataURL('image/jpeg', 0.75);
                const wrapper = document.getElementById(targetWrapperId);
                if (wrapper) {
                    wrapper.innerHTML = `<img src="${imgUrl}" class="slot-cover-img" alt="Capa">`;
                }
            } catch (e) {
                console.warn("Capa indisponível para:", urlPdf);
            }
        }

        function renderPage(num) {
            pageIsRendering = true;
            $('#input-page-num').val(num);

            if (documentoAtualKey) {
                localStorage.setItem(`lks_page_${documentoAtualKey}`, num);
            }

            if (currentRenderTask) {
                currentRenderTask.cancel();
                currentRenderTask = null;
            }

            pdfDoc.getPage(num).then(page => {
                const containerWidth = $('.modal-body').width() - 40;
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                const calculatedScale = Math.min(containerWidth / unscaledViewport.width, 1.6);

                const dpr = window.devicePixelRatio || 1;
                const baseScale = Math.max(calculatedScale, 0.8) * pdfScaleModifier;
                const viewport = page.getViewport({ scale: baseScale });

                canvas.width = Math.floor(viewport.width * dpr);
                canvas.height = Math.floor(viewport.height * dpr);

                canvas.style.width = Math.floor(viewport.width) + 'px';
                canvas.style.height = Math.floor(viewport.height) + 'px';

                ctx.save();
                ctx.scale(dpr, dpr);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                currentRenderTask = page.render(renderContext);

                currentRenderTask.promise.then(() => {
                    ctx.restore();
                    pageIsRendering = false;
                    currentRenderTask = null;

                    $('#pdf-loader').hide();
                    $('#pdf-canvas').css('opacity', '1');

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                }).catch(err => {
                    ctx.restore();
                    if (err.name !== 'RenderingCancelledException') {
                        console.error("Erro na renderização:", err);
                    }
                });
            });
        }

        function queueRenderPage(num) {
            if (pageIsRendering) {
                pageNumPending = num;
            } else {
                $('#pdf-canvas').css('opacity', '0.3');
                renderPage(num);
            }
        }

        function showPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function showNextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function abrirModalPdf(pdfUrl, pdfTitle) {
            $('#pdf-modal-title').text(pdfTitle.toUpperCase());
            $('#pdf-canvas').css('opacity', '0');
            $('#pdf-loader').css('display', 'flex');
            pdfScaleModifier = 1.0;
            
            documentoAtualKey = btoa(pdfTitle).replace(/=/g, '');

            $('#modal-overlay').show(0, function() {
                $(this).addClass('active');
            });

            const paginaSalva = parseInt(localStorage.getItem(`lks_page_${documentoAtualKey}`)) || 1;
            pageNum = paginaSalva;

            pdfjsLib.getDocument(pdfUrl).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                $('#total-pages-count').text(pdfDoc.numPages);
                $('#input-page-num').attr('max', pdfDoc.numPages);
                if (pageNum > pdfDoc.numPages) pageNum = 1;
                renderPage(pageNum);
            }).catch(err => {
                alert('Erro na leitura do documento.');
                $('#pdf-loader').hide();
            });
        }

        $(document).ready(function() {
            inicializarAcervo();

            // MODO DE VISUALIZAÇÃO (GRADE / LISTA)
            $('#btn-view-grid').on('click', function() {
                $('.view-btn').removeClass('active');
                $(this).addClass('active');
                $('#painel-slots').removeClass('list-mode');
            });

            $('#btn-view-list').on('click', function() {
                $('.view-btn').removeClass('active');
                $(this).addClass('active');
                $('#painel-slots').addClass('list-mode');
            });

            // PESQUISA EM TEMPO REAL
            $('#search-input').on('input', function() {
                const termo = $(this).val().toLowerCase().trim();
                if (!termo) {
                    renderizarSlots(listaDocumentosAtuais);
                    return;
                }
                const filtrados = listaDocumentosAtuais.filter(doc => 
                    doc.name.toLowerCase().includes(termo)
                );
                renderizarSlots(filtrados);
            });

            // CONTROLES DE ZOOM NO LEITOR
            $('#btn-zoom-in').on('click', function() {
                pdfScaleModifier += 0.15;
                queueRenderPage(pageNum);
            });

            $('#btn-zoom-out').on('click', function() {
                if (pdfScaleModifier <= 0.5) return;
                pdfScaleModifier -= 0.15;
                queueRenderPage(pageNum);
            });

            $('#btn-zoom-reset').on('click', function() {
                pdfScaleModifier = 1.0;
                queueRenderPage(pageNum);
            });

            // SALTO DIRETO DE PÁGINA
            $('#input-page-num').on('change', function() {
                let val = parseInt($(this).val());
                if (isNaN(val) || val < 1) val = 1;
                if (pdfDoc && val > pdfDoc.numPages) val = pdfDoc.numPages;
                pageNum = val;
                queueRenderPage(pageNum);
            });

            // NAVEGAÇÃO E TECLADO
            $('#prev-page-btn').on('click', showPrevPage);
            $('#next-page-btn').on('click', showNextPage);

            $(document).on('keydown', function(e) {
                if (!$('#modal-overlay').hasClass('active')) return;
                if (e.keyCode === 37) showPrevPage(); // Seta Esquerda
                if (e.keyCode === 39) showNextPage(); // Seta Direita
                if (e.keyCode === 27) $('#close-modal').click(); // ESC
            });

            $('#close-modal, #modal-overlay').on('click', function(e) {
                if (e.target !== this && e.target.id !== 'close-modal' && $(e.target).parents('#close-modal').length === 0) return;
                $('#modal-overlay').removeClass('active');
                setTimeout(() => { 
                    $('#modal-overlay').hide();
                    if (currentRenderTask) {
                        currentRenderTask.cancel();
                        currentRenderTask = null;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    pdfDoc = null;
                }, 250);
            });
        });
    </script>
</body>
</html>
