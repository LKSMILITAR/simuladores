<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKSMILITAR | Portal Técnico & Simulação</title>
  <link rel="stylesheet" href="./src/library-engine/styles/library-engine.css">
  <style>
    :root {
      --bg-main: #0a0e17;
      --bg-panel: #121824;
      --border-color: #222f43;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-red: #dc2626;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.8rem 1.8rem;
      background-color: var(--bg-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin: 0;
    }

    button.btn-acervo {
      background: rgba(220, 38, 38, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button.btn-acervo:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      overflow: hidden;
    }

    .viewer-card {
      background-color: var(--bg-panel);
      padding: 2.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .viewer-card h2 {
      margin-top: 0;
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: var(--accent-red);
      text-transform: uppercase;
    }

    .viewer-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0;
    }

    .document-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .document-container iframe {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22l10-4 10 4L12 2z"/></svg>
      <h1 class="brand-title">LKSMILITAR DATABASE</h1>
    </div>
    <button id="open-library-btn" class="btn-acervo">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      <span>ACERVO TÁTICO</span>
    </button>
  </header>

  <main id="main-viewport">
    <div class="viewer-card" id="default-card">
      <h2>Visualizador Técnico</h2>
      <p id="selected-document-display">Nenhum documento selecionado no sistema.</p>
    </div>
  </main>

  <script type="module">
    import { LibraryNavigationEngine } from './src/library-engine/index.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const engine = new LibraryNavigationEngine({ 
        baseUrl: './' 
      });

      await engine.init();

      const openBtn = document.getElementById('open-library-btn');
      if (openBtn) {
        openBtn.addEventListener('click', () => {
          engine.toggle();
        });
      }

      window.addEventListener('library:document-selected', (e) => {
        const doc = e.detail;
        const mainViewport = document.getElementById('main-viewport');
        const documentPath = `./documents/${encodeURIComponent(doc.path)}`;

        if (doc.path && doc.path.endsWith('.pdf')) {
          mainViewport.innerHTML = `
            <div class="document-container">
              <iframe src="${documentPath}" title="${doc.path}"></iframe>
            </div>
          `;
        } else {
          document.getElementById('selected-document-display').innerText = `Documento ativo: ${doc.path}`;
        }

        engine.close();
      });
    });
  </script>
</body>
</html>
