<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKS MILITAR - Tactical Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-main: #0a0d14;
            --bg-sidebar: rgba(16, 22, 35, 0.7);
            --bg-card: #111622;
            --border-glow: #384f30;
            --accent-green: #5c804f;
            --accent-glow: #7ca86d;
            --text-primary: #f1f5f9;
            --text-muted: #475569;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- MENU LATERAL RETRÁTIL (GLASSMORPHISM) --- */
        #sidebar {
            width: 70px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        #sidebar:hover {
            width: 260px;
            box-shadow: 15px 0 35px rgba(0, 0, 0, 0.5);
            border-right: 1px solid var(--border-glow);
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding-left: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sidebar-brand i {
            font-size: 20px;
            color: var(--accent-green);
            min-width: 35px;
        }

        .sidebar-brand span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        #sidebar:hover .sidebar-brand span { opacity: 1; }

        .menu-section { padding: 20px 0; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            border-left: 3px solid transparent;
        }

        .menu-item i {
            font-size: 18px;
            min-width: 35px;
        }

        .menu-item span {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-weight: 500;
            font-size: 13px;
        }

        #sidebar:hover .menu-item span { opacity: 1; }

        .menu-item:hover {
            color: #fff;
            background: rgba(92, 128, 79, 0.1);
            border-left-color: var(--accent-green);
        }

        .menu-item.active {
            color: #fff;
            background: rgba(92, 128, 79, 0.15);
            border-left-color: var(--accent-green);
            font-weight: 600;
        }

        .menu-item.active i { color: var(--accent-glow); }

        /* --- VISUALIZAÇÃO PRINCIPAL --- */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: radial-gradient(circle at top right, #101626 0%, var(--bg-main) 60%);
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--text-muted);
        }

        .content-body { padding: 35px; max-width: 1400px; }

        .category-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .category-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(92, 128, 79, 0.3) 0%, transparent 100%);
        }

        /* --- GRID DE SLOTS FUTURISTAS --- */
        .grid-acervo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 25px;
        }

        .slot-container {
            position: relative;
            background: var(--bg-card);
            border-radius: 8px;
            aspect-ratio: 1 / 1.45;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .slot-container.empty {
            background: repeating-linear-gradient(45deg, #111622, #111622 10px, #131a29 10px, #131a29 20px);
            opacity: 0.35;
        }

        .slot-container.populated {
            border: 1px solid rgba(92, 128, 79, 0.2);
            background: linear-gradient(145deg, #151c2c 0%, #0d121f 100%);
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .slot-container.populated:hover {
            transform: translateY(-6px);
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px rgba(92, 128, 79, 0.2);
        }

        .slot-meta { display: flex; justify-content: space-between; align-items: center; }

        .slot-index {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .slot-container.populated .slot-index { color: var(--accent-glow); }

        .slot-status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
        }

        .slot-container.populated .slot-status-dot {
            background: #22c55e; box-shadow: 0 0 8px #22c55e;
        }

        .slot-icon {
            font-size: 40px;
            color: rgba(255, 255, 255, 0.08);
            align-self: center;
            transition: all 0.3s ease;
        }

        .slot-container.populated:hover .slot-icon {
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .slot-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .slot-container.populated .slot-title { color: var(--text-primary); }

        /* --- VISUALIZADOR TEATRAL DE PDF --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 12, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }

        .btn-modal-close {
            position: absolute; top: 25px; right: 35px;
            font-size: 32px; color: var(--text-muted);
            cursor: pointer; transition: color 0.2s;
        }

        .btn-modal-close:hover { color: #f43f5e; }

        #loading-panel {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--accent-glow);
        }

        #flipbook-frame { display: none; }
        #canvas-holder-3d { box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
        .page-node-3d { background: #fff; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-shield-halved"></i>
            <span>LKS MILITAR</span>
        </div>
        <div class="menu-section">
            <div class="menu-item active" onclick="alterarCategoria('fisica_classica', this)">
                <i class="fa-solid fa-atom"></i>
                <span>Física Clássica</span>
            </div>
            <div class="menu-item" onclick="alterarCategoria('termodinamica', this)">
                <i class="fa-solid fa-temperature-arrow-up"></i>
                <span>Termodinâmica</span>
            </div>
            <div class="menu-item" onclick="alterarCategoria('eletrodinamica', this)">
                <i class="fa-solid fa-bolt"></i>
                <span>Eletrodinamica</span>
            </div>
        </div>
    </div>

    <div id="main-view">
        <header>
            <h2>ARCHIVE INTERFACE v2.0</h2>
        </header>

        <div class="content-body">
            <div class="category-header" id="txt-categoria-atual">Física Clássica</div>
            <div class="grid-acervo" id="painel-slots">
                </div>
        </div>
    </div>

    <div id="modal-overlay">
        <span class="btn-modal-close" onclick="fecharLivro()">&times;</span>
        <div id="loading-panel">PROCESSANDO DOCUMENTO TÁTICO...</div>
        <div id="flipbook-frame">
            <div id="canvas-holder-3d"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let categoriaAtiva = 'fisica_classica';

        function alterarCategoria(chave, elemento) {
            categoriaAtiva = chave;
            $('.menu-item').removeClass('active');
            $(elemento).addClass('active');
            $('#txt-categoria-atual').text($(elemento).find('span').text());
            gerarGradeSlots();
        }

        function gerarGradeSlots() {
            const painel = $('#painel-slots');
            painel.empty();

            for (let i = 1; i <= 20; i++) {
                const caminhoPdf = `${categoriaAtiva}/${i}.pdf`;
                const htmlSlot = `
                    <div class="slot-container empty" id="slot-id-${i}">
                        <div class="slot-meta">
                            <div class="slot-index">${String(i).padStart(2, '0')}</div>
                            <div class="slot-status-dot"></div>
                        </div>
                        <i class="fa-solid fa-file-pdf slot-icon"></i>
                        <div class="slot-title">SLOT VAZIO</div>
                    </div>`;
                painel.append(htmlSlot);
                escaneamentoDeArquivo(caminhoPdf, i);
            }
        }

        function escaneamentoDeArquivo(url, index) {
            fetch(url, { method: 'HEAD' })
                .then(resposta => {
                    if (resposta.ok) {
                        const alvo = $(`#slot-id-${index}`);
                        alvo.removeClass('empty').addClass('populated');
                        alvo.find('.slot-title').text(`DOCUMENTO TÁTICO ${index}`);
                        alvo.attr('onclick', `abrirEstrutura3D('${url}')`);
                    }
                })
                .catch(() => {});
        }

        async function abrirEstrutura3D(caminhoOriginal) {
            $('#modal-overlay').css('display', 'flex');
            $('#loading-panel').show();
            $('#flipbook-frame').hide();

            const canvasHolder = $('#canvas-holder-3d');
            if (canvasHolder.data('turn')) {
                canvasHolder.turn('destroy');
            }
            canvasHolder.empty();

            try {
                const docPdf = await pdfjsLib.getDocument(caminhoOriginal).promise;
                const totalPaginas = docPdf.numPages;
                const primeiraPagina = await docPdf.getPage(1);
                const painelVisao = primeiraPagina.getViewport({ scale: 1.2 });
                const larguraPagina = painelVisao.width;
                const alturaPagina = painelVisao.height;

                for (let num = 1; num <= totalPaginas; num++) {
                    canvasHolder.append(`<div class="page-node-3d"><canvas id="render-canv-${num}"></canvas></div>`);
                    const paginaAlvo = await docPdf.getPage(num);
                    const canvasElemento = document.getElementById(`render-canv-${num}`);
                    const contextoGrafico = canvasElemento.getContext('2d');
                    canvasElemento.width = larguraPagina;
                    canvasElemento.height = alturaPagina;

                    await paginaAlvo.render({
                        canvasContext: contextoGrafico,
                        viewport: paginaAlvo.getViewport({ scale: 1.2 })
                    }).promise;
                }

                $('#loading-panel').hide();
                $('#flipbook-frame').show();

                canvasHolder.turn({
                    width: larguraPagina * 2,
                    height: alturaPagina,
                    autoCenter: true,
                    duration: 750,
                    acceleration: true
                });

            } catch (falha) {
                $('#loading-panel').text('ERRO NA LEITURA E EXTRAÇÃO DO ARQUIVO PDF.');
                console.error(falha);
            }
        }

        function fecharLivro() {
            $('#modal-overlay').hide();
            const canvasHolder = $('#canvas-holder-3d');
            if (canvasHolder.data('turn')) {
                canvasHolder.turn('destroy');
            }
        }

        $(document).ready(gerarGradeSlots);
    </script>
</body>
</html>
