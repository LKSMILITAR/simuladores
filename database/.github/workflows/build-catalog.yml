name: Build Catalog Database

on:
  push:
    paths:
      - 'database/documents/**'
      - 'database/scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Catalog JSON
        run: node/database/scripts/build-catalog.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/assets/catalog/root.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build: Atualização do catálogo database/assets/catalog/root.json" && git push)
