name: Build Static Catalog Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Catalog Builder
        run: node scripts/build-catalog.js

      - name: Commit and Push Cleaned Manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/catalog/
          git diff-index --quiet HEAD || git commit -m "chore: purge ghost files and build updated catalog"
          git push
