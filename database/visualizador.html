<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualizador de Documentos - LKS</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            background-color: #242424;
            border-bottom: 1px solid #333333;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 10;
            user-select: none;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button,
        a.btn-download {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition:
                background-color 0.1s ease,
                border-color 0.1s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover,
        a.btn-download:hover {
            background-color: #444444;
            border-color: #555555;
        }

        button:disabled,
        a.btn-download[aria-disabled="true"] {
            background-color: #222222;
            border-color: #2a2a2a;
            color: #666666;
            cursor: not-allowed;
            pointer-events: none;
        }

        .page-info {
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-info input {
            background-color: #1a1a1a;
            border: 1px solid #444444;
            color: #ffffff;
            text-align: center;
            width: 52px;
            padding: 4px;
            font-size: 13px;
            border-radius: 3px;
        }

        .page-info input:focus {
            outline: 1px solid #0088ff;
            border-color: #0088ff;
        }

        .viewport-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background-color: #121212;
            position: relative;
        }

        .canvas-wrapper {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            background-color: #ffffff;
            line-height: 0;
            border-radius: 2px;
            position: relative;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 5;
            padding: 24px;
            font-size: 14px;
            color: #cccccc;
            text-align: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #333333;
            border-top: 3px solid #0088ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .error-message {
            color: #ff5555;
            max-width: 720px;
            line-height: 1.5;
            word-break: break-word;
        }

        .error-path {
            color: #aaaaaa;
            font-family: monospace;
            font-size: 12px;
            max-width: 720px;
            line-height: 1.5;
            word-break: break-all;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <button
                id="prev-page"
                type="button"
                title="Página anterior"
                disabled
            >
                Anterior
            </button>

            <div class="page-info">
                <span>Pág.</span>

                <input
                    type="number"
                    id="page-num"
                    value="1"
                    min="1"
                    disabled
                >

                <span>
                    de <span id="page-count">--</span>
                </span>
            </div>

            <button
                id="next-page"
                type="button"
                title="Próxima página"
                disabled
            >
                Próxima
            </button>
        </div>

        <div class="toolbar-group">
            <button
                id="zoom-out"
                type="button"
                title="Reduzir zoom"
                disabled
            >
                -
            </button>

            <span id="zoom-percent" class="page-info">
                125%
            </span>

            <button
                id="zoom-in"
                type="button"
                title="Aumentar zoom"
                disabled
            >
                +
            </button>

            <button
                id="zoom-fit"
                type="button"
                title="Ajustar à largura"
                disabled
            >
                Ajustar largura
            </button>
        </div>

        <div class="toolbar-group">
            #
                Baixar PDF
            </a>
        </div>
    </div>

    <div class="viewport-container" id="viewport">
        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <span>Processando arquivo...</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <script>
        "use strict";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const SITE_BASE_PATH = "/simuladores/";
        const DATABASE_BASE_PATH = "/simuladores/database/";
        const DOCUMENTS_BASE_PATH = "/simuladores/database/documents/";

        const canvas = document.getElementById("pdf-canvas");
        const context = canvas.getContext("2d", {
            alpha: false
        });

        const viewportElement = document.getElementById("viewport");
        const loadingElement = document.getElementById("loading");

        const previousButton = document.getElementById("prev-page");
        const nextButton = document.getElementById("next-page");
        const zoomOutButton = document.getElementById("zoom-out");
        const zoomInButton = document.getElementById("zoom-in");
        const zoomFitButton = document.getElementById("zoom-fit");

        const pageNumberInput = document.getElementById("page-num");
        const pageCountElement = document.getElementById("page-count");
        const zoomPercentElement =
            document.getElementById("zoom-percent");
        const downloadButton =
            document.getElementById("download-btn");

        let pdfDocument = null;
        let pageNumber = 1;
        let scale = 1.25;
        let pageRendering = false;
        let pendingPageNumber = null;
        let activeRenderTask = null;

        /**
         * Decodifica um segmento somente quando necessário.
         * URLSearchParams já realiza uma etapa de decodificação.
         */
        function safelyDecodeSegment(segment) {
            try {
                return decodeURIComponent(segment);
            } catch {
                return segment;
            }
        }

        /**
         * Normaliza a rota conforme o sistema de arquivos do GitHub Pages:
         * - converte barras invertidas;
         * - normaliza Unicode para NFC;
         * - remove "." e rejeita "..";
         * - codifica espaços, vírgulas, acentos e caracteres especiais;
         * - preserva as barras separadoras.
         */
        function sanitizePathname(pathname) {
            const normalizedPath = String(pathname)
                .replace(/\\/g, "/")
                .normalize("NFC");

            const sanitizedSegments = [];

            for (const rawSegment of normalizedPath.split("/")) {
                if (!rawSegment || rawSegment === ".") {
                    continue;
                }

                const decodedSegment =
                    safelyDecodeSegment(rawSegment).normalize("NFC");

                if (decodedSegment === "..") {
                    throw new Error(
                        "A rota do documento contém navegação inválida."
                    );
                }

                sanitizedSegments.push(
                    encodeURIComponent(decodedSegment)
                );
            }

            return "/" + sanitizedSegments.join("/");
        }

        /**
         * Aceita:
         *
         * documents/Disciplina/Arquivo.pdf
         * ./documents/Disciplina/Arquivo.pdf
         * /simuladores/database/documents/Disciplina/Arquivo.pdf
         * https://lksmilitar.github.io/simuladores/database/documents/...
         *
         * Rotas relativas são resolvidas a partir de /database/.
         */
        function resolveDocumentUrl(rawFile) {
            if (typeof rawFile !== "string" || !rawFile.trim()) {
                throw new Error(
                    "O parâmetro obrigatório ?file= não foi informado."
                );
            }

            const normalizedInput = rawFile
                .trim()
                .replace(/\\/g, "/")
                .normalize("NFC");

            const databaseBaseUrl = new URL(
                DATABASE_BASE_PATH,
                window.location.origin
            );

            const candidateUrl = new URL(
                normalizedInput,
                databaseBaseUrl
            );

            if (
                candidateUrl.protocol !== "https:" &&
                candidateUrl.protocol !== "http:"
            ) {
                throw new Error(
                    "O protocolo informado para o documento não é permitido."
                );
            }

            /*
             * O leitor aceita URLs absolutas, mas bloqueia outra origem.
             * Isso evita CORS inesperado e limita o leitor ao GitHub Pages
             * que está hospedando a aplicação.
             */
            if (candidateUrl.origin !== window.location.origin) {
                throw new Error(
                    "O documento precisa estar hospedado na mesma origem da aplicação."
                );
            }

            candidateUrl.pathname = sanitizePathname(
                candidateUrl.pathname
            );

            /*
             * Restringe o documento ao diretório oficial do acervo.
             */
            if (
                !candidateUrl.pathname.startsWith(
                    DOCUMENTS_BASE_PATH
                )
            ) {
                throw new Error(
                    "O documento solicitado está fora de " +
                    DOCUMENTS_BASE_PATH
                );
            }

            candidateUrl.hash = "";

            return candidateUrl.href;
        }

        function showError(message, path = "") {
            loadingElement.style.display = "flex";

            const messageElement = document.createElement("div");
            messageElement.className = "error-message";
            messageElement.textContent = message;

            loadingElement.replaceChildren(messageElement);

            if (path) {
                const pathElement = document.createElement("div");
                pathElement.className = "error-path";
                pathElement.textContent = path;
                loadingElement.appendChild(pathElement);
            }

            setControlsEnabled(false);
        }

        function setControlsEnabled(enabled) {
            previousButton.disabled = !enabled || pageNumber <= 1;

            nextButton.disabled =
                !enabled ||
                !pdfDocument ||
                pageNumber >= pdfDocument.numPages;

            zoomOutButton.disabled = !enabled;
            zoomInButton.disabled = !enabled;
            zoomFitButton.disabled = !enabled;
            pageNumberInput.disabled = !enabled;

            downloadButton.setAttribute(
                "aria-disabled",
                enabled ? "false" : "true"
            );
        }

        function updateControls() {
            if (!pdfDocument) {
                setControlsEnabled(false);
                return;
            }

            pageNumberInput.value = String(pageNumber);
            pageNumberInput.max = String(pdfDocument.numPages);
            pageCountElement.textContent =
                String(pdfDocument.numPages);

            zoomPercentElement.textContent =
                Math.round(scale * 100) + "%";

            setControlsEnabled(true);
        }

        async function renderPage(number) {
            if (!pdfDocument) {
                return;
            }

            pageRendering = true;

            try {
                const page = await pdfDocument.getPage(number);
                const displayViewport = page.getViewport({
                    scale
                });

                const pixelRatio = Math.max(
                    window.devicePixelRatio || 1,
                    1
                );

                canvas.width = Math.floor(
                    displayViewport.width * pixelRatio
                );

                canvas.height = Math.floor(
                    displayViewport.height * pixelRatio
                );

                canvas.style.width =
                    Math.floor(displayViewport.width) + "px";

                canvas.style.height =
                    Math.floor(displayViewport.height) + "px";

                /*
                 * setTransform redefine a transformação.
                 * Não acumula escala após zoom ou mudança de página.
                 */
                context.setTransform(
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0
                );

                context.clearRect(
                    0,
                    0,
                    displayViewport.width,
                    displayViewport.height
                );

                activeRenderTask = page.render({
                    canvasContext: context,
                    viewport: displayViewport
                });

                await activeRenderTask.promise;
            } catch (error) {
                /*
                 * RenderingCancelledException não representa falha do PDF.
                 */
                if (error?.name !== "RenderingCancelledException") {
                    console.error(
                        "[LKSMILITAR VIEWER] Falha na renderização:",
                        error
                    );

                    showError(
                        "Não foi possível renderizar a página selecionada."
                    );
                }
            } finally {
                pageRendering = false;
                activeRenderTask = null;
                updateControls();

                if (pendingPageNumber !== null) {
                    const nextPendingPage = pendingPageNumber;
                    pendingPageNumber = null;
                    renderPage(nextPendingPage);
                }
            }
        }

        function queueRenderPage(number) {
            if (!pdfDocument) {
                return;
            }

            const validPage = Math.min(
                Math.max(Number(number), 1),
                pdfDocument.numPages
            );

            pageNumber = validPage;
            updateControls();

            if (pageRendering) {
                pendingPageNumber = validPage;
                return;
            }

            renderPage(validPage);
        }

        function onPreviousPage() {
            if (!pdfDocument || pageNumber <= 1) {
                return;
            }

            queueRenderPage(pageNumber - 1);
        }

        function onNextPage() {
            if (
                !pdfDocument ||
                pageNumber >= pdfDocument.numPages
            ) {
                return;
            }

            queueRenderPage(pageNumber + 1);
        }

        function onZoomIn() {
            if (!pdfDocument || scale >= 3) {
                return;
            }

            scale = Math.min(scale + 0.25, 3);
            queueRenderPage(pageNumber);
        }

        function onZoomOut() {
            if (!pdfDocument || scale <= 0.5) {
                return;
            }

            scale = Math.max(scale - 0.25, 0.5);
            queueRenderPage(pageNumber);
        }

        async function onZoomFit() {
            if (!pdfDocument) {
                return;
            }

            try {
                const page = await pdfDocument.getPage(pageNumber);

                const unscaledViewport = page.getViewport({
                    scale: 1
                });

                const availableWidth = Math.max(
                    viewportElement.clientWidth - 40,
                    200
                );

                scale = Math.min(
                    Math.max(
                        availableWidth / unscaledViewport.width,
                        0.5
                    ),
                    3
                );

                queueRenderPage(pageNumber);
            } catch (error) {
                console.error(
                    "[LKSMILITAR VIEWER] Falha ao ajustar largura:",
                    error
                );
            }
        }

        async function loadDocument() {
            const searchParameters = new URLSearchParams(
                window.location.search
            );

            /*
             * URLSearchParams.get() já devolve o valor decodificado.
             * Não aplique decodeURIComponent diretamente sobre o valor
             * inteiro, pois isso pode causar dupla decodificação.
             */
            const rawFile = searchParameters.get("file");

            let documentUrl;

            try {
                documentUrl = resolveDocumentUrl(rawFile);
            } catch (error) {
                console.error(
                    "[LKSMILITAR VIEWER] Rota inválida:",
                    error
                );

                showError(
                    error.message ||
                    "A rota informada para o documento é inválida.",
                    rawFile || ""
                );

                return;
            }

            downloadButton.href = documentUrl;

            try {
                const loadingTask = pdfjsLib.getDocument({
                    url: documentUrl,
                    withCredentials: false,
                    disableRange: false,
                    disableStream: false,
                    disableAutoFetch: false
                });

                pdfDocument = await loadingTask.promise;

                pageNumber = 1;
                pageCountElement.textContent =
                    String(pdfDocument.numPages);

                pageNumberInput.max =
                    String(pdfDocument.numPages);

                loadingElement.style.display = "none";

                updateControls();
                await renderPage(pageNumber);
            } catch (error) {
                console.error(
                    "[LKSMILITAR VIEWER] Falha no PDF.js:",
                    error
                );

                showError(
                    "Erro ao carregar o PDF. Verifique se o nome, " +
                    "as maiúsculas, os acentos e o diretório correspondem " +
                    "exatamente ao arquivo existente no GitHub.",
                    documentUrl
                );
            }
        }

        previousButton.addEventListener(
            "click",
            onPreviousPage
        );

        nextButton.addEventListener(
            "click",
            onNextPage
        );

        zoomInButton.addEventListener(
            "click",
            onZoomIn
        );

        zoomOutButton.addEventListener(
            "click",
            onZoomOut
        );

        zoomFitButton.addEventListener(
            "click",
            onZoomFit
        );

        pageNumberInput.addEventListener("change", function () {
            if (!pdfDocument) {
                return;
            }

            const selectedPage = Number.parseInt(
                this.value,
                10
            );

            if (
                Number.isInteger(selectedPage) &&
                selectedPage >= 1 &&
                selectedPage <= pdfDocument.numPages
            ) {
                queueRenderPage(selectedPage);
            } else {
                this.value = String(pageNumber);
            }
        });

        window.addEventListener("keydown", function (event) {
            if (
                event.target instanceof HTMLInputElement ||
                event.target instanceof HTMLTextAreaElement
            ) {
                return;
            }

            if (
                event.key === "ArrowRight" ||
                event.key === "PageDown"
            ) {
                event.preventDefault();
                onNextPage();
            }

            if (
                event.key === "ArrowLeft" ||
                event.key === "PageUp"
            ) {
                event.preventDefault();
                onPreviousPage();
            }
        });

        loadDocument();
    </script>
</body>
</html>
