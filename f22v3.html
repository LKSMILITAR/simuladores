<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-22 Raptor - Digital Target Scan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #020604;
      overflow: hidden;
    }

    body, html {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* HUD militar em verde esmeralda com alto contraste */
    .hud-header {
      position: absolute;
      top: 25px;
      width: 90%;
      display: flex;
      justify-content: space-between;
      color: #00ff66;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
      z-index: 10;
      pointer-events: none;
    }

    .hud-footer {
      position: absolute;
      bottom: 25px;
      width: 90%;
      display: flex;
      justify-content: space-between;
      color: #00ff66;
      font-size: 12px;
      letter-spacing: 1.5px;
      opacity: 0.8;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      z-index: 10;
      pointer-events: none;
    }

    .blink {
      animation: blinker 1s linear infinite;
    }

    @keyframes blinker {
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="hud-header">
    <div>SYSTEM SCAN: <span class="blink">ACTIVE</span></div>
    <div>TARGET ID: F-22 RAPTOR</div>
    <div>DATA STREAM: BINARY_AERO</div>
  </div>

  <canvas id="radarCanvas"></canvas>

  <div class="hud-footer">
    <div>SIGINT / AESA RADAR HARVESTING</div>
    <div>FREQ: 9.85 GHz // GAIN: +42dB</div>
    <div>STATUS: THREAT DISCRIMINATED</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('radarCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Matriz de dados binários de fundo (Sinal Fraco / Data Stream)
  const fontSize = 14;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = Array(columns).fill(0).map(() => Math.floor(Math.random() * -100));

  window.addEventListener('resize', () => {
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(0).map(() => Math.floor(Math.random() * -100));
  });

  // Mapeamento geométrico vetorial do F-22 em visão frontal
  function getF22Points() {
    const pts = [];

    // 1. Radome / Nariz central
    for (let y = -20; y <= 40; y += 4) {
      let w = (y + 20) * 0.45;
      for (let x = -w; x <= w; x += 4) {
        pts.push({x: x, y: y, type: 'cockpit'});
      }
    }

    // 2. Canopy (Canopi com destaque reluzente)
    for (let y = -35; y < -15; y += 3) {
      let w = (y + 35) * 0.7;
      for (let x = -w; x <= w; x += 3.5) {
        pts.push({x: x, y: y, type: 'glass'});
      }
    }

    // 3. Tomadas de Ar e Fuselagem Central
    for (let y = 10; y <= 55; y += 4) {
      let leftIntake = -40 - (y - 10) * 0.3;
      let rightIntake = 40 + (y - 10) * 0.3;
      for (let x = leftIntake; x <= rightIntake; x += 4.5) {
        pts.push({x: x, y: y, type: 'body'});
      }
    }

    // 4. Geometria das Asas (Bordos de ataque e extremidades Stealth)
    for (let x = -380; x <= -40; x += 4.5) {
      let progress = (x + 380) / 340;
      let yTop = 35 - progress * 15;
      let yBot = 38 + progress * 10;
      for (let y = yTop; y <= yBot; y += 4) {
        let isEdge = (Math.abs(y - yTop) < 3 || Math.abs(x) > 370);
        pts.push({x: x, y: y, type: isEdge ? 'edge' : 'wing'});
      }
    }
    for (let x = 40; x <= 380; x += 4.5) {
      let progress = (380 - x) / 340;
      let yTop = 35 - progress * 15;
      let yBot = 38 + progress * 10;
      for (let y = yTop; y <= yBot; y += 4) {
        let isEdge = (Math.abs(y - yTop) < 3 || Math.abs(x) > 370);
        pts.push({x: x, y: y, type: isEdge ? 'edge' : 'wing'});
      }
    }

    // 5. Lemes Duplos em V (Estabilizadores Verticais com inclinação de 28°)
    for (let y = -160; y <= 10; y += 4) {
      let progress = (y + 160) / 170;
      let centerX = -110 - (1 - progress) * 50;
      let width = 6 + progress * 18;
      for (let x = centerX - width/2; x <= centerX + width/2; x += 4) {
        pts.push({x: x, y: y, type: 'tail'});
      }
    }
    for (let y = -160; y <= 10; y += 4) {
      let progress = (y + 160) / 170;
      let centerX = 110 + (1 - progress) * 50;
      let width = 6 + progress * 18;
      for (let x = centerX - width/2; x <= centerX + width/2; x += 4) {
        pts.push({x: x, y: y, type: 'tail'});
      }
    }

    // 6. Estabilizadores Horizontais Traseiros
    for (let x = -340; x <= -200; x += 5) {
      let y = 45 + (x + 340) * 0.08;
      pts.push({x: x, y: y, type: 'wing'});
      pts.push({x: x, y: y + 4, type: 'wing'});
    }
    for (let x = 200; x <= 340; x += 5) {
      let y = 45 + (340 - x) * 0.08;
      pts.push({x: x, y: y, type: 'wing'});
      pts.push({x: x, y: y + 4, type: 'wing'});
    }

    return pts;
  }

  const f22Points = getF22Points();
  let frame = 0;

  function render() {
    frame++;
    const width = canvas.width;
    const height = canvas.height;

    // Fundo escuro tático
    ctx.fillStyle = 'rgba(2, 6, 4, 0.25)';
    ctx.fillRect(0, 0, width, height);

    // 1. Chuva Binária de Fundo
    ctx.font = `${fontSize}px monospace`;
    for (let i = 0; i < drops.length; i++) {
      const char = Math.random() > 0.5 ? '1' : '0';
      const x = i * fontSize;
      const y = drops[i] * fontSize;

      ctx.fillStyle = 'rgba(0, 255, 102, 0.12)';
      ctx.fillText(char, x, y);

      if (y > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }

    // 2. Movimento de Arfagem / Oscilação Tática (Para baixo e para cima)
    const time = frame * 0.025;
    const translateY = Math.sin(time) * 35; 
    const scale = 1 + Math.sin(time * 0.5) * 0.03; 

    const centerX = width / 2;
    const centerY = height / 2 + translateY;

    // 3. Desenho Binário do F-22 com Gradação de Brilho e Contraste
    ctx.font = 'bold 11px monospace';

    for (let i = 0; i < f22Points.length; i++) {
      const pt = f22Points[i];
      const px = centerX + pt.x * scale;
      const py = centerY + pt.y * scale;

      const char = Math.random() > 0.3 ? (i % 2 === 0 ? '1' : '0') : (Math.random() > 0.5 ? '0' : '1');

      if (pt.type === 'edge' || pt.type === 'glass') {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 10;
      } else if (pt.type === 'tail') {
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 6;
      } else if (pt.type === 'cockpit') {
        ctx.fillStyle = '#33ff99';
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 5;
      } else {
        ctx.fillStyle = '#00e65c';
        ctx.shadowBlur = 0;
      }

      ctx.fillText(char, px, py);
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
